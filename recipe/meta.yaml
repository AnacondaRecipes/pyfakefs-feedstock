{% set name = "pyfakefs" %}
{% set version = "5.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: ca02a1441dc77d7512bebfe4224b32f2127e83c45672f5fe2c02c33d4284bc70

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - pyfakefs
  source_files:
    - pyfakefs
  requires:
    - pip
    - pytest >=6.2.5
  commands:
    - pip check
    # Set PYTHONPATH to use local pyfakefs directory for tests.
    # Warnings occur when pyfakefs's pause/resume functionality creates real temporary files
    # that get cleaned up after the fake filesystem is restored, causing FileNotFoundError during cleanup.
    # These warnings are informative and don't cause test failures.
    - PYTHONPATH=. pytest pyfakefs/tests -v -W "ignore::pytest.PytestUnraisableExceptionWarning:_pytest.unraisableexception"  # [unix]
    - PYTHONPATH=. pytest pyfakefs/pytest_tests -v  -W "ignore::pytest.PytestUnraisableExceptionWarning:_pytest.unraisableexception"  # [unix]
    - set PYTHONPATH=. && pytest pyfakefs/tests -v -W ignore::pytest.PytestUnraisableExceptionWarning  # [win]
    - set PYTHONPATH=. && pytest pyfakefs/pytest_tests -v  -W "ignore::pytest.PytestUnraisableExceptionWarning:_pytest.unraisableexception"  # [win]

about:
  home: https://github.com/pytest-dev/pyfakefs
  license: Apache-2.0
  license_family: Apache
  license_file: COPYING
  summary: A fake file system that mocks the Python file system modules.
  description: |
    Pyfakefs implements a fake file system that mocks the Python file system
    modules. Using pyfakefs, your tests operate on a fake file system in
    memory without touching the real disk. The software under test requires
    no modification to work with pyfakefs. pyfakefs works with Linux, Windows
    and macOS.
  doc_url: https://pytest-pyfakefs.readthedocs.io
  dev_url: https://github.com/pytest-dev/pyfakefs

extra:
  recipe-maintainers:
    - tswast
    - thewchan
